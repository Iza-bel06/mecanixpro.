<script>
    function agregarFila(tablaId, descClass, precioClass) {
        const tbody = document.getElementById(tablaId);
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" class="${descClass}"></td>
            <td><input type="number" class="${precioClass}" step="0.01"></td>
            <td style="text-align: center;"><button type="button" class="btn-delete" onclick="eliminarFila(this)">✕</button></td>
        `;
        tbody.appendChild(tr);
    }

    function eliminarFila(btn) {
        const tr = btn.closest('tr');
        if (tr.parentNode.children.length > 1) {
            tr.remove();
        } else {
            tr.querySelectorAll('input').forEach(i => i.value = '');
        }
        calcularTotales();
    }

    function calcularTotales() {
        let totalServicios = 0;
        document.querySelectorAll('.serv-precio').forEach(inp => {
            totalServicios += parseFloat(inp.value) || 0;
        });

        let totalRepuestos = 0;
        document.querySelectorAll('.rep-precio').forEach(inp => {
            totalRepuestos += parseFloat(inp.value) || 0;
        });

        const subtotal = totalServicios + totalRepuestos;
        const igv = subtotal * 0.18;
        const grandTotal = subtotal + igv;

        const elServ = document.getElementById('tot-servicios');
        const elRep = document.getElementById('tot-repuestos');
        const elSub = document.getElementById('tot-subtotal');
        const elIgv = document.getElementById('tot-igv');
        const elFin = document.getElementById('tot-final');

        if (elServ) elServ.innerText = 'S/ ' + totalServicios.toFixed(2);
        if (elRep) elRep.innerText = 'S/ ' + totalRepuestos.toFixed(2);
        if (elSub) elSub.innerText = 'S/ ' + subtotal.toFixed(2);
        if (elIgv) elIgv.innerText = 'S/ ' + igv.toFixed(2);
        if (elFin) elFin.innerText = 'S/ ' + grandTotal.toFixed(2);
    }

    // Escuchar cambios en tiempo real en todo el documento
    document.addEventListener('input', calcularTotales);

    document.getElementById('ordenForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const servicios = [];
        document.querySelectorAll('#tabla-servicios tr').forEach(tr => {
            const desc = tr.querySelector('.serv-desc').value;
            const precio = tr.querySelector('.serv-precio').value;
            if (desc.trim() !== '') servicios.push({ descripcion: desc, precio: parseFloat(precio) || 0 });
        });

        const repuestos = [];
        document.querySelectorAll('#tabla-repuestos tr').forEach(tr => {
            const desc = tr.querySelector('.rep-desc').value;
            const precio = tr.querySelector('.rep-precio').value;
            if (desc.trim() !== '') repuestos.push({ descripcion: desc, precio: parseFloat(precio) || 0 });
        });

        const payload = {
            cliente: {
                tipo_doc: document.getElementById('tipo_doc').value,
                num_doc: document.getElementById('num_doc').value,
                nombre: document.getElementById('nombre_cliente').value,
                telefono: document.getElementById('telefono').value,
                correo: document.getElementById('correo').value,
                direccion: document.getElementById('direccion').value
            },
            vehiculo: {
                placa: document.getElementById('placa').value,
                marca: document.getElementById('marca').value,
                modelo: document.getElementById('modelo').value,
                anio: document.getElementById('anio').value,
                km: document.getElementById('km').value,
                color: document.getElementById('color').value,
                chasis: document.getElementById('chasis').value,
                motor: document.getElementById('motor').value
            },
            servicios: servicios,
            repuestos: repuestos
        };

        console.log(payload);
        alert('Orden lista para enviar');
    });

    // Calcular al cargar la página
    window.addEventListener('DOMContentLoaded', calcularTotales);
</script>
